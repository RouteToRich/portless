# pre-commit install   (once per clone)  ·  pre-commit run --all-files   (by hand)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
        exclude: ^(\.vscode/|data/)
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (errors only — syntax, undefined names)
        args: [--select, "E9,F63,F7,F82"]
  - repo: local
    hooks:
      - id: no-secrets-or-tracking-files
        name: never commit .env, *.creds or the LLM tracking file
        entry: python scripts/precommit_forbidden.py
        language: system
        pass_filenames: true
      - id: no-control-characters
        name: no control characters in source files
        entry: python -m pytest -q -p no:cacheprovider tests/test_source_hygiene.py
        language: system
        pass_filenames: false
        types: [python]
