[project]
name = "portless"
version = "0.1.0"
description = "PortLess — Zero-Inventory Autonomous Merchant Exporter Platform (FastAPI modular monolith skeleton)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "langchain-anthropic>=0.1",
    "langgraph>=0.1",
]

[tool.setuptools.packages.find]
include = ["shared*", "services*"]

[tool.ruff]
line-length = 100
target-version = "py311"
