[project]
name = "portless"
version = "0.1.0"
description = "PortLess — Zero-Inventory Autonomous Merchant Exporter Platform (FastAPI modular monolith skeleton)"
requires-python = ">=3.11"
# Keep in sync with requirements.txt — Vercel's Python builder installs from
# THIS list when pyproject.toml exists, not from requirements.txt.
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "aioimaplib>=0.9",
    "aiosmtplib>=3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "asyncpg>=0.29",
    "PyJWT>=2.8",
    "motor>=3.3",
    "apscheduler>=3.10",
    "nats-py[nkeys]>=2.9",
    "jinja2>=3.1",
    "langgraph>=0.1,<1.0",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.2",
]

[tool.setuptools.packages.find]
include = ["shared*", "services*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
