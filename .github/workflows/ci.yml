# Backend CI: every push and pull request. Branch protection on main should require "tests".
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The suite never touches a real database, gateway or provider (tests/conftest.py pins
      # these too); set here so nothing in the runner's environment can leak in.
      MONGO_URI: ""
      LLM_GATEWAY_URL: ""
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Ruff (errors only — syntax, undefined names)
        run: ruff check . --select E9,F63,F7,F82 --output-format=github
      - name: Every test has a Gherkin scenario
        run: python scripts/gen_unit_gherkin.py --check
      - name: Tests (with coverage)
        run: >
          pytest -q -p no:cacheprovider --cov=agents --cov=services --cov=shared --cov=app --cov-branch
          --cov-report=json:coverage.json --cov-report=term:skip-covered
      - name: Coverage gate (overall floor + money modules — scripts/coverage_gate.py)
        run: python scripts/coverage_gate.py coverage.json

  security:
    # bandit blocks on high-severity, high-confidence findings; the dependency audits report
    # without failing the build until a first clean run is confirmed (then drop continue-on-error).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install scanners
        run: pip install bandit pip-audit
      - name: bandit (high severity, high confidence)
        run: bandit -r services shared agents app.py -lll -iii -q
      - name: pip-audit (known vulnerable dependencies)
        continue-on-error: true
        run: pip-audit -r requirements.txt
      - name: Secret scan (gitleaks; an organisation repo needs GITLEAKS_LICENSE — non-blocking until set)
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
